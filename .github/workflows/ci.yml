name: CI

# Vercel already builds every push, and `next build` runs TypeScript, so this
# workflow deliberately does NOT rebuild. What it adds is what Vercel doesn't
# check: lint, the test suite, and the i18n scan.
on:
  push:
    branches: [main]
  pull_request:

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Kept separate so a failure names itself in the job list, instead of
      # everyone having to open the log to find out which check broke.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      # Four of these boot a real Postgres (pglite, WASM) and replay every
      # migration into it. That's slow on a shared runner — `hookTimeout` is
      # already raised to 30s in vitest.config.ts, and a file that times out
      # reports as *skipped* rather than failed, which reads like it passed.
      - name: Test
        run: npm test

      # User-visible text that never made it into messages/*.json. The lint
      # rules catch JSX text and attributes; this catches the shape they can't
      # see — a literal inside an expression. Exits non-zero on any finding, so
      # this step really does gate.
      - name: i18n scan
        run: npm run i18n:scan
